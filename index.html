<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3Dモデル ドラッグ＆ドロップ確認ツール</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #333; color: white; font-family: sans-serif; }
        canvas { display: block; width: 100vw; height: 100vh; }
        #drop-zone {
            position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
            display: flex; justify-content: center; align-items: center;
            background-color: rgba(0, 0, 0, 0.7); z-index: 10;
            border: 5px dashed #888; box-sizing: border-box;
        }
        #drop-zone p { font-size: 24px; pointer-events: none; }
        #loading { position: absolute; top: 20px; left: 20px; font-size: 18px; display: none; z-index: 5; color: #333; font-weight: bold; }
        
        #instructions {
            position: absolute; bottom: 20px; left: 20px;
            background-color: rgba(255, 255, 255, 0.85); color: #333;
            padding: 12px 16px; border-radius: 8px; font-size: 14px;
            pointer-events: none; z-index: 5; display: none;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1); line-height: 1.5;
        }
    </style>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>
    <div id="drop-zone"><p>ここに .glb ファイルをドラッグ＆ドロップしてください</p></div>
    <div id="loading">読み込み中...</div>
    
    <div id="instructions">
        <b>【操作方法】</b><br>
        ・<b>左ドラッグ</b>：視点の回転<br>
        ・<b>右ドラッグ</b>：視点の平行移動<br>
        ・<b>ホイール</b>：拡大 / 縮小<br>
        <span style="color: #e60000; font-weight: bold;">・見たい場所をダブルクリック：そこを回転の中心にする</span>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xf0f0f0);
        
        // 【修正1】カメラの near（最小描画距離）を 0.00001 という極限まで小さくする
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.00001, 1000000);
        
        // 【修正2】logarithmicDepthBuffer を true にして、巨大なスケール差による面のチラつきを防ぐ
        const renderer = new THREE.WebGLRenderer({ 
            antialias: true,
            logarithmicDepthBuffer: true 
        });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.1;

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);
        const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
        directionalLight.position.set(100, 100, 50);
        scene.add(directionalLight);

        let currentModel = null;
        const dropZone = document.getElementById('drop-zone');
        const loading = document.getElementById('loading');
        const instructions = document.getElementById('instructions');

        ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
            window.addEventListener(eventName, preventDefaults, false);
        });
        function preventDefaults(e) { e.preventDefault(); e.stopPropagation(); }

        window.addEventListener('drop', (e) => {
            dropZone.style.display = 'none';
            loading.style.display = 'block';
            instructions.style.display = 'none';

            const file = e.dataTransfer.files[0];
            if (file && (file.name.endsWith('.glb') || file.name.endsWith('.gltf'))) {
                const objectURL = URL.createObjectURL(file);
                loadModel(objectURL);
            } else {
                alert('glb または gltf ファイルをドロップしてください。');
                dropZone.style.display = 'flex';
                loading.style.display = 'none';
            }
        });

        function loadModel(url) {
            const dracoLoader = new DRACOLoader();
            dracoLoader.setDecoderPath('https://www.gstatic.com/draco/versioned/decoders/1.5.6/');
            const loader = new GLTFLoader();
            loader.setDRACOLoader(dracoLoader);

            loader.load(
                url,
                function (gltf) {
                    if (currentModel) scene.remove(currentModel);

                    currentModel = gltf.scene;
                    scene.add(currentModel);
                    loading.style.display = 'none';
                    instructions.style.display = 'block'; 

                    const box = new THREE.Box3().setFromObject(currentModel);
                    const center = box.getCenter(new THREE.Vector3());
                    const size = box.getSize(new THREE.Vector3());
                    const maxDim = Math.max(size.x, size.y, size.z);

                    currentModel.position.x -= center.x;
                    currentModel.position.y -= center.y;
                    currentModel.position.z -= center.z;

                    const fov = camera.fov * (Math.PI / 180);
                    let cameraDist = Math.abs((maxDim / 2) / Math.tan(fov / 2)) * 1.2;
                    if(cameraDist < 1) cameraDist = 10;

                    // 描画限界(far)だけを調整し、nearは初期設定の極小値を維持する
                    camera.far = cameraDist * 10;
                    camera.updateProjectionMatrix();

                    camera.position.set(cameraDist * 0.7, cameraDist * 0.5, cameraDist * 0.7);
                    controls.target.set(0, 0, 0);
                    controls.update();
                },
                undefined,
                function (error) {
                    console.error(error);
                    alert('読み込みエラーが発生しました。');
                    loading.style.display = 'none';
                    dropZone.style.display = 'flex';
                }
            );
        }

        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        window.addEventListener('dblclick', (event) => {
            if (!currentModel) return;

            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);

            const intersects = raycaster.intersectObject(currentModel, true);

            if (intersects.length > 0) {
                const point = intersects[0].point;
                controls.target.copy(point);
                controls.update();
            }
        });

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
